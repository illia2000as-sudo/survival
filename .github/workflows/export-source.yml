name: Export Survival source ZIP

on:
  push:
    branches:
      - temp-export-survival-zip

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Create source archive
        run: git archive --format=zip --prefix=survival/ HEAD -o Survival-project.zip
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Survival-project-source
          path: Survival-project.zip
          retention-days: 7
