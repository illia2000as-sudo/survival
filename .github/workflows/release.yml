name: Release

# Запускается вручную: Actions -> Release -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка зависимостей
        run: npm install

      - name: Сборка exe
        run: npx electron-builder --win portable --publish never

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Игра, сборка ${{ github.run_number }}
          files: dist/*.exe
